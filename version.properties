# Authoritative project version, in the Linux Foundation / ONAP
# convention that global-jjb established: the major/minor/patch trio
# is the source of truth, and the derived keys below interpolate from
# it when Jenkins sources this file in shell.
#
# docker-workflows' merge lane reads this through
# build-metadata-action, which parses rather than sources the file and
# therefore skips the ${...} values. The trio is what it composes the
# version from, so this fixture exercises that path rather than the
# simpler literal 'version=' form.

major=1
minor=2
patch=3

base_version=${major}.${minor}.${patch}
release_version=${base_version}
snapshot_version=${base_version}-SNAPSHOT
